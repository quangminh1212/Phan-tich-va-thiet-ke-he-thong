<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nhóm 1 — Hệ thống quản lý hàng hóa và kho bãi sản phẩm thời trang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&amp;display=swap" rel="stylesheet" />
  <style>
    :root {
      /* HUST: đỏ logo #C81028, gạch Brandfetch #9D1D1F, vàng logo #F0C008, trắng #FDFAFB */
      --red: #C81028;
      --red-d: #9D1D1F;
      --gold: #F0C008;
      --navy: #9D1D1F;
      --ink: #1A1A1A;
      --muted: #5C5C5C;
      --line: #E8D9DC;
      --paper: #FDFAFB;
      --card: #ffffff;
      --ok: #1f7a4d;
      --warn: #b45309;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0e141d; }
    body { font-family: "Be Vietnam Pro", "Segoe UI", sans-serif; color: var(--ink); }
    #stage { width: 100vw; height: 100vh; display: grid; place-items: center; }
    #canvas { width: 1920px; height: 1080px; position: relative; transform-origin: center center; background: var(--paper); box-shadow: 0 24px 80px rgba(0,0,0,.45); }
    .slide {
      position: absolute; inset: 0; display: none; padding: 56px 80px 70px;
      background: var(--paper);
    }
    .slide.on { display: flex; flex-direction: column; gap: 18px; }
    .slide.cover, .slide.end { padding: 0; }
    .kicker { font-size: 18px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--red); }
    h1 { font-size: 46px; font-weight: 800; line-height: 1.18; letter-spacing: -.02em; }
    h2 { font-size: 40px; font-weight: 800; letter-spacing: -.02em; }
    p, li { font-size: 22px; line-height: 1.45; }
    .muted { color: var(--muted); }
    .gold { color: var(--gold); }
    .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .bar .rule { flex: 1; height: 2px; background: linear-gradient(90deg, var(--red), var(--gold) 55%, transparent); margin-left: 24px; }
    .foot {
      position: absolute; left: 80px; right: 80px; bottom: 22px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 15px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px;
    }
    .foot b { color: var(--red); font-weight: 700; }
    .grid { display: grid; gap: 20px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 22px 24px; box-shadow: 0 8px 24px rgba(21,32,51,.05);
    }
    .card h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .num {
      font-size: 34px; font-weight: 800; color: var(--red); letter-spacing: -.03em; line-height: 1;
    }
    .tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: #f3e6e9; color: var(--red); font-size: 14px; font-weight: 700;
      padding: 4px 10px; border-radius: 999px; letter-spacing: .02em;
    }
    .tag.navy { background: #F3E6E8; color: var(--red-d); }
    .tag.gold { background: #FFF6CC; color: #7A5C00; }
    .tag.ok { background: #e5f4ea; color: var(--ok); }
    table { width: 100%; border-collapse: collapse; font-size: 18px; }
    th { text-align: left; background: var(--red); color: #fff; font-weight: 600; padding: 10px 14px; }
    td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr:nth-child(even) td { background: #fbfaf7; }
    ul.clean { list-style: none; }
    ul.clean li { position: relative; padding-left: 22px; margin: 8px 0; }
    ul.clean li::before { content: ""; position: absolute; left: 0; top: 11px; width: 10px; height: 10px; background: var(--red); border-radius: 2px; }
    .cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .cols-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 18px; }
    .cols-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .cols-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
    .progress { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: #e8e2d6; z-index: 5; }
    .progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--red), var(--gold)); width: 0; }
    #hud, .hint { display: none !important; }
    .tier { min-width: 280px; }
    .grow { flex: 1; min-height: 0; }

    /* Cover */
    .cover-bg {
      display: grid; grid-template-columns: 1.15fr .85fr; height: 100%;
    }
    .cover-l { background: var(--red); color: #fff; padding: 72px 80px; display: flex; flex-direction: column; }
    .cover-r { background: var(--paper); padding: 72px 64px; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand img { width: 78px; height: 78px; }
    .brand .uni { font-size: 15px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
    .brand .sch { font-size: 18px; font-weight: 700; }
    .cover-l h1 { font-size: 44px; margin-top: 48px; color: #fff; }
    .cover-l .sub { margin-top: 22px; font-size: 22px; color: #FFE8EA; max-width: 820px; }
    .meta-row { margin-top: auto; display: flex; gap: 36px; }
    .meta-row .lab { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
    .meta-row .val { font-size: 20px; font-weight: 700; margin-top: 4px; }
    .member { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .av {
      width: 46px; height: 46px; border-radius: 50%; background: var(--red); color: #fff;
      display: grid; place-items: center; font-weight: 800; font-size: 15px; flex-shrink: 0;
    }
    .av.g { background: var(--gold); color: #1A1A1A; }
    .member .nm { font-weight: 700; font-size: 20px; }
    .member .role { font-size: 15px; color: var(--muted); }

    /* Timeline */
    .tl { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; position: relative; }
    .tl::before {
      content: ""; position: absolute; left: 8px; right: 8px; top: 18px; height: 3px;
      background: linear-gradient(90deg, var(--red), var(--gold));
    }
    .tl .ph { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 36px 14px 16px; position: relative; }
    .tl .dot {
      position: absolute; top: 10px; left: 16px; width: 16px; height: 16px; border-radius: 50%;
      background: var(--red); border: 3px solid #fff; box-shadow: 0 0 0 2px var(--red);
    }
    .tl .ph b { display: block; font-size: 22px; }
    .tl .ph span { display: block; font-size: 15px; color: var(--muted); margin-top: 4px; }

    .flow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .chip { background: var(--red-d); color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 18px; }
    .chip.alt { background: var(--red); }
    .arr { color: var(--gold); font-size: 26px; font-weight: 800; }

    .prob { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px 16px; align-items: stretch; }
    .prob .from, .prob .to { padding: 8px 14px; border-radius: 10px; font-size: 17px; }
    .prob .from { background: #f8e9ec; color: var(--red-d); }
    .prob .to { background: #e7f4ec; color: #145a38; }
    .prob .arrow { display: grid; place-items: center; color: var(--gold); font-weight: 800; font-size: 22px; }

    .arch { display: grid; grid-template-columns: 300px 1fr; gap: 10px; }
    .tier { padding: 14px 18px; border-radius: 12px; color: #fff; font-weight: 700; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; min-height: 68px; }
    .tier span { font-weight: 500; opacity: .9; margin-left: 0; font-size: 16px; }

    .end-bg { height: 100%; background: var(--red); color: #fff; display: flex; flex-direction: column; padding: 90px 100px; }
    .end-bg h1 { color: #fff; font-size: 72px; }
    .q { font-size: 28px; color: var(--gold); margin-top: 12px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; }

    @media print {
      @page { size: 1920px 1080px; margin: 0; }
      html, body, #stage { overflow: visible !important; height: auto !important; background: #fff; }
      #canvas { transform: none !important; box-shadow: none; page-break-after: always; }
      .slide { display: flex !important; position: relative; page-break-after: always; height: 1080px; }
      #hud, .hint { display: none !important; }
    }
  </style>
</head>
<body>
  <div class="progress"><i id="bar"></i></div>
  <div id="stage"><div id="canvas"></div></div>
  <div class="hint">← → Space · F toàn màn hình · Home/End</div>
  <div id="hud">
    <button type="button" id="prev" aria-label="Trước">‹</button>
    <button type="button" id="next" aria-label="Sau">›</button>
  </div>

  <template id="slides">
    <!-- 1 COVER -->
    <section class="slide cover">
      <div class="cover-bg">
        <div class="cover-l">
          <div class="brand">
            <img src="hust-logo.png" alt="Logo ĐHBK Hà Nội" />
            <div>
              <div class="uni">Đại học Bách khoa Hà Nội</div>
              <div class="sch">Trường Công nghệ Thông tin và Truyền thông</div>
            </div>
          </div>
          <div class="tag gold" style="margin-top:48px;align-self:flex-start;">Bài tập lớn · Mã CNTT20261_N01</div>
          <h1>Hệ thống quản lý hàng hóa và kho bãi sản phẩm thời trang</h1>
          <p class="sub">Từ khảo sát hiện trạng đến tôn chỉ, WBS, phân tích thiết kế UML, dự toán kinh phí và kế hoạch quản lý chất lượng.</p>
          <div class="meta-row">
            <div><div class="lab">Thời gian</div><div class="val">01/09/2026 – 31/03/2027</div></div>
            <div><div class="lab">Ngân sách</div><div class="val">408.196.650 ₫</div></div>
            <div><div class="lab">GVHD</div><div class="val">ThS. Lê Thị Hoa</div></div>
          </div>
        </div>
        <div class="cover-r">
          <div class="kicker">Nhóm 1 · K6901 CNTT VB2CQ</div>
          <h2 style="margin:10px 0 28px;">Thành viên</h2>
          <div class="member"><div class="av">TA</div><div><div class="nm">Bùi Tuấn Anh · 202490032</div><div class="role">Giám đốc dự án · Phân tích nghiệp vụ</div></div></div>
          <div class="member"><div class="av g">QL</div><div><div class="nm">Bùi Quốc Luýt · 202490069</div><div class="role">Trưởng nhóm kỹ thuật · Back-end</div></div></div>
          <div class="member"><div class="av">QM</div><div><div class="nm">Vũ Quang Minh · 202490071</div><div class="role">Lập trình Back-end</div></div></div>
          <div class="member"><div class="av g">MQ</div><div><div class="nm">Bạch Minh Quang · 202490077</div><div class="role">Thiết kế UI/UX · Front-end</div></div></div>
          <div class="member"><div class="av">BT</div><div><div class="nm">Phạm Đoàn Bảo Thiên · 202490090</div><div class="role">Thiết kế CSDL · Kiểm thử</div></div></div>
          <p class="muted" style="margin-top:auto;font-size:16px;">Hà Nội, tháng 9 năm 2026</p>
        </div>
      </div>
    </section>

    <!-- 2 AGENDA -->
    <section class="slide">
      <div class="bar"><div><div class="kicker">Nội dung</div><h2>Bố cục thuyết trình</h2></div><div class="rule"></div></div>
      <div class="cols-3">
        <div class="card">
          <span class="tag">Hiện trạng &amp; tôn chỉ</span>
          <ol class="toc" style="margin-top:14px;padding-left:28px;font-size:20px;line-height:1.7;">
            <li>Bìa · Nhóm 1 · CNTT20261_N01</li>
            <li>Bố cục thuyết trình</li>
            <li>Bối cảnh ngành thời trang</li>
            <li>Khảo sát hiện trạng &amp; 10 vấn đề</li>
            <li>Tôn chỉ dự án (Project Charter)</li>
          </ol>
        </div>
        <div class="card">
          <span class="tag navy">Tổ chức &amp; yêu cầu</span>
          <ol class="toc" start="6" style="margin-top:14px;padding-left:28px;font-size:20px;line-height:1.7;">
            <li>Mục tiêu đo được &amp; phạm vi</li>
            <li>Tổ chức nhóm, phân công, công</li>
            <li>WBS 6 giai đoạn · 52 task</li>
            <li>19 use case · 4 gói · 3 vai trò</li>
            <li>Sáu QT nghiệp vụ + 11 NFR</li>
          </ol>
        </div>
        <div class="card">
          <span class="tag gold">Thiết kế &amp; kiểm soát</span>
          <ol class="toc" start="11" style="margin-top:14px;padding-left:28px;font-size:20px;line-height:1.7;">
            <li>Kiến trúc 3 tầng · 6 hệ thống con</li>
            <li>CSDL 15 bảng · 10 màn hình</li>
            <li>Dự toán 408,2 triệu đồng</li>
            <li>Kế hoạch quản lý chất lượng</li>
            <li>Kết luận &amp; thảo luận</li>
          </ol>
        </div>
      </div>
      <div class="card">
        <p style="font-size:22px;"><b>Luận điểm:</b> Kho là trung tâm. Mọi thay đổi tồn phải đi qua phiếu kho; tồn được quản lý đến từng biến thể (màu × size), không phải đến từng mẫu.</p>
      </div>
      <div class="foot"><span>Nhóm 1 · CNTT20261_N01</span><span>Trang <b>2</b> / 15</span></div>
    </section>

    <!-- 3 CONTEXT -->
    <section class="slide">
      <div class="bar"><div><div class="kicker">Bối cảnh</div><h2>Vì sao phải làm hệ thống này?</h2></div><div class="rule"></div></div>
      <div class="cols-2 grow">
        <div class="grid" style="gap:16px;">
          <div class="card">
            <h3>Doanh nghiệp được khảo sát</h3>
            <p>Kinh doanh áo, quần, váy, áo khoác: <b>một kho tổng + kho cửa hàng</b>, nhập nhiều NCC, bán song song tại quầy và trực tuyến.</p>
            <p style="margin-top:10px;">Hiện ghi nhận bằng <b>sổ sách và nhiều file Excel rời</b>. Tồn không realtime, khó truy vết, báo cáo mất cả ngày.</p>
          </div>
          <div class="card" style="border-left:6px solid var(--gold);">
            <h3>Đơn vị quản lý đúng không phải là mẫu</h3>
            <p>Cùng Áo thun Basic AT001, bản <b>Đen/M</b> và <b>Đen/L</b> là hai mặt hàng khác tồn, khác vị trí, khác tốc độ bán.</p>
          </div>
          <div class="card">
            <h3>Đặc thù hàng thời trang</h3>
            <ul class="clean">
              <li>Mẫu mã đổi theo mùa; không xóa mẫu hết mùa, chuyển Ngừng bán</li>
              <li>Size chữ (S–XL) cho áo, size số (29, 30, 32…) cho quần</li>
              <li>Bán đa kênh: dễ xuất vượt tồn nếu không khóa dòng</li>
              <li>Đổi size / đổi mẫu, hàng lỗi, hàng thanh lý, hàng tồn lâu</li>
            </ul>
          </div>
        </div>
        <div class="card">
          <h3>Ví dụ mẫu AT01 — tổng 6.500 SP không đủ để soạn hàng</h3>
          <table style="margin-top:12px;">
            <thead><tr><th>Biến thể</th><th>Tồn</th></tr></thead>
            <tbody>
              <tr><td>Đen / S</td><td>1.000</td></tr>
              <tr><td>Đen / M</td><td>1.500</td></tr>
              <tr><td>Đen / L</td><td>800</td></tr>
              <tr><td>Trắng / S</td><td>1.200</td></tr>
              <tr><td>Trắng / M</td><td>2.000</td></tr>
            </tbody>
          </table>
          <p class="muted" style="margin-top:14px;font-size:18px;">Nhân viên không biết còn đủ size M màu đen để giao một đơn hay không nếu chỉ nhìn số tổng của mẫu.</p>
        </div>
      </div>
      <div class="foot"><span>Nhóm 1 · CNTT20261_N01</span><span>Trang <b>3</b> / 15</span></div>
    </section>

    <!-- 4 SURVEY -->
    <section class="slide">
      <div class="bar"><div><div class="kicker">Khảo sát</div><h2>Hiện trạng và 10 vấn đề cần giải quyết</h2></div><div class="rule"></div></div>
      <div class="flow">
        <div class="chip">Nhập hàng</div><span class="arr">→</span>
        <div class="chip">Xuất hàng</div><span class="arr">→</span>
        <div class="chip">Kiểm kê</div><span class="arr">→</span>
        <div class="chip">Đổi trả</div><span class="arr">+</span>
        <div class="chip alt">Chuyển kho · Hủy hàng</div>
      </div>
      <div class="cols-2 grow" style="align-items:stretch;">
        <div class="prob">
          <div class="from">Dữ liệu phân tán, không đồng nhất</div><div class="arrow">→</div><div class="to">Một hệ thống tập trung</div>
          <div class="from">Khó quản lý màu / size</div><div class="arrow">→</div><div class="to">Biến thể + mã SKU</div>
          <div class="from">Tồn sai, không realtime</div><div class="arrow">→</div><div class="to">Cập nhật khi phiếu hoàn tất</div>
          <div class="from">Khó truy vết biến động</div><div class="arrow">→</div><div class="to">Thẻ kho chỉ thêm, không sửa</div>
          <div class="from">Tìm kiếm thông tin chậm</div><div class="arrow">→</div><div class="to">Lọc theo SP, màu, size, kho</div>
          <div class="from">Kiểm kê, đối chiếu thủ công</div><div class="arrow">→</div><div class="to">Tự tính chênh lệch, có duyệt</div>
          <div class="from">Báo cáo thủ công cả ngày</div><div class="arrow">→</div><div class="to">Tự tổng hợp, xuất Excel</div>

          <div class="from">Khó phát hiện hàng sắp hết</div><div class="arrow">→</div><div class="to">Cảnh báo so với tồn tối thiểu</div>
          <div class="from">Hàng tồn lâu không thấy</div><div class="arrow">→</div><div class="to">Báo cáo số ngày tồn kho</div>
        </div>
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:14px;align-content:start;">
          <div class="card"><div class="num">13</div><p style="margin-top:8px;">biểu mẫu thu thập<br><span class="muted">7 phiếu · 6 báo cáo</span></p></div>
          <div class="card"><div class="num">4</div><p style="margin-top:8px;">quy trình cốt lõi<br><span class="muted">+ chuyển kho, hủy hàng</span></p></div>
          <div class="card"><div class="num">3</div><p style="margin-top:8px;">tác nhân sử dụng<br><span class="muted">QL · NV kho · NV bán hàng</span></p></div>
          <div class="card"><div class="num">SKU</div><p style="margin-top:8px;">AT001-DEN-M<br><span class="muted">mẫu · màu · size</span></p></div>
          <div class="card" style="grid-column:1 / -1;">
            <h3>NCC và khách không phải tác nhân hệ thống</h3>
            <p>Họ không đăng nhập. Tên NCC nằm trên phiếu nhập; tên khách và mã đơn nằm trên phiếu xuất / đổi trả — nhân viên nhập vào.</p>
          </div>
        </div>
      </div>
      <div class="foot"><span>Nhóm 1 · CNTT20261_N01</span><span>Trang <b>4</b> / 15</span></div>
    </section>

    <!-- 5 CHARTER -->
    <section class="slide">
      <div class="bar"><div><div class="kicker">Tôn chỉ dự án</div><h2>Project Charter — CNTT20261_N01</h2></div><div class="rule"></div></div>
      <div class="cols-4" style="margin-bottom:20px;">
        <div class="card"><div class="kicker">Bắt đầu</div><div class="num" style="font-size:28px;margin-top:8px;">01/09/2026</div></div>
        <div class="card"><div class="kicker">Kết thúc</div><div class="num" style="font-size:28px;margin-top:8px;">31/03/2027</div></div>
        <div class="card"><div class="kicker">Thời lượng</div><div class="num" style="font-size:28px;margin-top:8px;">07 tháng</div></div>

  <script>
    const canvas = document.getElementById("canvas");
    const tpl = document.getElementById("slides");
    tpl.content.querySelectorAll(".slide").forEach((s) => canvas.appendChild(s.cloneNode(true)));
    const slides = [...canvas.querySelectorAll(".slide")];
    let i = 0;
    const bar = document.getElementById("bar");

    function go(n) {
      i = (n + slides.length) % slides.length;
      slides.forEach((s, k) => s.classList.toggle("on", k === i));
      bar.style.width = ((i + 1) / slides.length * 100) + "%";
      history.replaceState(null, "", "#" + (i + 1));
    }
    function fit() {
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      canvas.style.transform = "scale(" + s + ")";
    }
    window.addEventListener("resize", fit);
    window.addEventListener("keydown", (e) => {
      if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(i + 1); }
      if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); go(i - 1); }
      if (e.key === "Home") go(0);
      if (e.key === "End") go(slides.length - 1);
      if (e.key === "f" || e.key === "F") document.documentElement.requestFullscreen?.();
    });
    document.getElementById("next").onclick = () => go(i + 1);
    document.getElementById("prev").onclick = () => go(i - 1);
    canvas.addEventListener("click", (e) => {
      if (e.target.closest("a,button")) return;
      go(e.clientX > window.innerWidth / 2 ? i + 1 : i - 1);
    });
    let tx = 0;
    canvas.addEventListener("touchstart", (e) => { tx = e.changedTouches[0].clientX; }, { passive: true });
    canvas.addEventListener("touchend", (e) => {
      const dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 40) go(dx < 0 ? i + 1 : i - 1);
    });
    fit();
    const hash = parseInt((location.hash || "#1").slice(1), 10);
    go(Number.isFinite(hash) ? hash - 1 : 0);
  </script>
